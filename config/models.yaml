# --- judge ------------------------------------------------------------------
# Gemini through the Antigravity CLI on a subscription. --sandbox is
# deliberate: a judge with tools could look up the source work while scoring a
# translation of it, which stops it measuring the translation.
- id: gemini-judge
  runner: agy
  model: gemini-3.7-flash-high
  json_schema: config/schemas/judgment.json
  sandbox: true
