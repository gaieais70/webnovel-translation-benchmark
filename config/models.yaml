# Models under test: the opencode-go subscription roster.
# Endpoint is OpenAI-compatible; the key comes from OPENCODE_API_KEY.
#
# Ordered cheapest first, by published output price per 1M tokens, because
# `ati run` works down this list and a run interrupted by a usage limit should
# have spent the window on the models that cost least. glm-5.3, qwen3.7-max
# and kimi-k3 are held to the end deliberately, ahead of their price order.
#
# Anchors: hy3 as the weak reference, qwen3.8-max as the strong one. They run
# every time to detect drift and are not there to be ranked. Both are already
# in the pool, so marking them costs nothing extra.

# --- cheap tier -------------------------------------------------------------
- id: hy3                              # $0.0175 / $0.0725 per 1M
  runner: api
  endpoint: https://opencode.ai/zen/go/v1/chat/completions
  api_key_env: OPENCODE_API_KEY
  model: hy3
  anchor: weak
- id: glm-5.3-flash                    # new; flash tier, no published price
  runner: api
  endpoint: https://opencode.ai/zen/go/v1/chat/completions
  api_key_env: OPENCODE_API_KEY
  model: glm-5.3-flash
- id: muse-spark-1.2-contributor       # $0.10 / $0.20
  runner: api
  endpoint: https://opencode.ai/zen/go/v1/chat/completions
  api_key_env: OPENCODE_API_KEY
  model: muse-spark-1.2-contributor
- id: deepseek-v4-flash                # $0.22 / $0.66
  runner: api
  endpoint: https://opencode.ai/zen/go/v1/chat/completions
  api_key_env: OPENCODE_API_KEY
  model: deepseek-v4-flash
- id: mimo-v2.5-pro                    # $0.435 / $0.87
  runner: api
  endpoint: https://opencode.ai/zen/go/v1/chat/completions
  api_key_env: OPENCODE_API_KEY
  model: mimo-v2.5-pro

