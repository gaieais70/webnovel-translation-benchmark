# --- Claude, through the local Claude Code CLI ----------------------------
# Command Code serves no Claude model on this plan: every one answers
# MODEL_NOT_IN_PLAN (Sonnet and Haiku want Pro+, Opus wants Provider+), so the
# Messages-shaped runner that /provider/v1/messages needs would not have helped.
# These run on the operator's own Claude subscription instead, by subscription
# and not per token.
#
# What that costs in comparability, stated plainly: this is a different route
# from every other row, so these are not directly comparable to the API rows -
# the same caveat the roster header makes about opencode-go in 2026-08.
# `--system-prompt` REPLACES Claude Code's own system prompt rather than
# appending to it, and the tool list is denied outright, so what runs is the
# model on the text and not the coding agent around it. `sandbox: true` runs
# each call from an empty directory, so the CLI cannot read this repository -
# a translator that can see the benchmark scoring it is not under test
# conditions. Full model names, not the `opus`/`sonnet` aliases, so a row
# still names one model after the alias moves.

- id: opus-5
  runner: cli
  system_prompt_flag: --system-prompt
  sandbox: true
  timeout_s: 1800
  command:
    - claude
    - -p
    - --model
    - claude-opus-5
    - --effort
    - max
    - --disallowed-tools
    - Bash Edit Write Read Glob Grep WebFetch WebSearch Task NotebookEdit
    - --no-session-persistence
    - --strict-mcp-config
    - --disable-slash-commands

- id: sonnet-5
  runner: cli
  system_prompt_flag: --system-prompt
  sandbox: true
  # 1800 was too short: at max effort sonnet-5 took 403s and 1,189s on the two
  # chapters that finished first, then a third ran past 1,800s and was killed
  # (2026-09-21). A timeout is only how long the harness waits, not a
  # generation setting, so raising it changes nothing about what is measured.
  timeout_s: 3600
  command:
    - claude
    - -p
    - --model
    - claude-sonnet-5
    - --effort
    - max
    - --disallowed-tools
    - Bash Edit Write Read Glob Grep WebFetch WebSearch Task NotebookEdit
    - --no-session-persistence
    - --strict-mcp-config
    - --disable-slash-commands

- id: haiku-4.5
  runner: cli
  system_prompt_flag: --system-prompt
  sandbox: true
  timeout_s: 1800
  command:
    - claude
    - -p
    - --model
    - claude-haiku-4-5-20251001
    - --effort
    - max
    - --disallowed-tools
    - Bash Edit Write Read Glob Grep WebFetch WebSearch Task NotebookEdit
    - --no-session-persistence
    - --strict-mcp-config
    - --disable-slash-commands

# --- held back --------------------------------------------------------------
# The expensive tier below the blank row in the routing sheet. The operator
# splits it into middle and high; the middle half is released and declared
# above (glm-5.3, kimi-k3), and the high half stays held:
#   xai/grok-4.6 ($2.00/$6.00), Qwen/Qwen3.8-Max ($2.00/$6.00)
# The sheet marks one break, not three tiers: everything above row 16 has run,
# and these are what is left. Prices are OpenRouter list, 2026-09-20.
# Kimi K2.6 is dropped outright - it is not used enough to be worth a row.
# The Claude column is no longer held: it is declared above, on the local CLI.
# The Google column stays held as a translation subject - gemini-3.8-flash is
# the one agy row under test, and it is named explicitly, never by default.

# --- judges -----------------------------------------------------------------
# Run 2026-09 uses Gemini for BOTH stages, rubric and pairwise, as the
# operator set it (config/ati.yaml: judge_model). That has a cost worth
# stating: with one judge on both stages, the rubric-versus-pairwise rank
# correlation measures that judge agreeing with itself, not two methods
# converging. The 2026-08 rho of 0.936 had the same limitation.
#
# sonnet-judge is kept declared but unused this run.
#
# `role: judge` keeps both rows out of `ati run` and the head-to-head pool: they
# are judges, not translation subjects. (An agy row is never a subject unless
# named with --model, whatever its role.)
# UNUSABLE as configured, found 2026-09-19: Command Code serves Claude only on
# /provider/v1/messages in the Anthropic Messages shape, and this harness speaks
# the OpenAI-compatible /chat/completions shape. It answers HTTP 400
# "must be called via /provider/v1/messages". Kept declared so the next attempt
# starts from this note; using it needs a Messages-shaped runner.
- id: sonnet-judge
  role: judge
  runner: api
  endpoint: https://api.commandcode.ai/provider/v1/chat/completions
  api_key_env: COMMANDCODE_API_KEY
  model: claude-sonnet-5
  json_schema: config/schemas/judgment.json

# Secondary judge, for the self-preference check the methodology describes.
# Deliberately a family that is in neither the judge's nor any subject's
# lineage: the primary judge is Gemini and gemini-3.8-flash is now a subject,
# so a Gemini judge cannot settle whether that row's scores are earned. grok is
# not a subject in this run. Default reasoning effort: this judges a sample for
# comparison, not the whole run.
- id: grok-judge
  role: judge
  runner: api
  endpoint: https://api.commandcode.ai/provider/v1/chat/completions
  api_key_env: COMMANDCODE_API_KEY
  stream: true
  model: xai/grok-4.6
  json_schema: config/schemas/judgment.json

# Gemini, through the Antigravity CLI on the operator's own Google account and
# by no other route - config.load_models refuses a Gemini slug on any runner
# but agy. Every call goes through CallGate (ati/runners/agy.py): one at a time
# machine-wide, spaced apart, from an empty directory. --sandbox is deliberate:
# a judge with tools could look up the source work while scoring a translation
# of it, which stops it measuring the translation.
- id: gemini-judge
  role: judge
  runner: agy
  model: gemini-3.7-flash-high
  json_schema: config/schemas/pairwise.json
  sandbox: true
  # Measured on this run: a rubric call takes 1.5-2.5 minutes, and the one
  # slow call observed hung for the full 900s default, then succeeded on retry
  # in 1.5. Eight minutes is ~3x a normal call and wastes far less on a hang.
  timeout_s: 480
