# Models under test for run 2026-09. Routing is from "Models to be tested and
# routing.xlsx" (2026-08-29); every slug below was resolved against the live
# provider catalogue rather than transcribed from the sheet's display names,
# because the sheet names models the way a person does and the APIs do not.
#
# Two routes only. The opencode-go endpoint that carried most of the 2026-08
# roster is gone from the routing sheet, so models that ran there last time
# (glm-5.3-flash, hy3, deepseek-v4-pro, mimo, minimax) are now reached through
# Command Code. That is a route change, not a model change: their 2026-08 rows
# are not directly comparable to what this run produces.
#
# Ordering is by route, then as listed in the sheet. glm-5.2 used to be held
# last because its paid OpenRouter fallback was the one expensive route in the
# roster; it now runs on Command Code by subscription, so nothing here is
# ordered by price any more.
#
# `params` sets reasoning effort to each model's top rung. The spelling differs
# by provider - OpenRouter nests it under `reasoning`, OpenAI-compatible routes
# take a flat `reasoning_effort` - and neither provider errors on a field it
# does not understand. Nothing in the harness verifies that the setting took:
# a model that silently ignores it runs at its default while this file says
# max. `reasoning_tokens` on each run record is the only evidence of what
# actually happened; check it before reading a row as a max-effort result.

# --- Command Code -----------------------------------------------------------
# https://api.commandcode.ai/provider/v1/chat/completions, COMMANDCODE_API_KEY
#
# Every row streams. The gateway abandons a buffered request that has not
# completed within ~125 seconds with a 524, so without streaming any model
# that reasons longer than that at max effort cannot finish a chapter at all -
# qwen3.8-flash failed 8 of 8, hy3 4 of 6 before this was changed.
- id: laguna-s-2.1
  runner: api
  endpoint: https://api.commandcode.ai/provider/v1/chat/completions
  api_key_env: COMMANDCODE_API_KEY
  stream: true
  model: poolside/laguna-s-2.1-free
  params:
    reasoning_effort: max

- id: minimax-m3
  runner: api
  endpoint: https://api.commandcode.ai/provider/v1/chat/completions
  api_key_env: COMMANDCODE_API_KEY
  stream: true
  # The catalogue also lists `minimax/minimax-m3-free`. The sheet says
  # "MiniMax M3" without qualification, so the paid row is used; the free one
  # is a different rate-limit regime and would not be the same measurement.
  model: MiniMaxAI/MiniMax-M3
  price: {input: 0.3, output: 1.2}   # minimax/minimax-m3, OpenRouter list 2026-09-23
  params:
    reasoning_effort: max
    # Command Code's default output cap for this model is ~5,120 tokens:
    # chapters 3 and 10 both stopped at exactly 5,120/5,119 with
    # finish_reason=length, reasoning included. A probe on 2026-09-18
    # confirmed 65,536 is accepted.
    max_tokens: 65536

