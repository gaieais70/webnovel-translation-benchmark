    # probe on 2026-09-22 confirmed the route accepts it. It is a ceiling, not
    # a target: a chapter that finishes below it is unaffected.
    max_tokens: 131072

# --- OpenRouter -------------------------------------------------------------
# https://openrouter.ai/api/v1/chat/completions, OPENROUTER_API_KEY
#
# Only models Command Code does not serve. Everything it does serve goes
# through it.
#
# Free tier first, paid only when the free route will not answer. A probe on
# 2026-08-29 found `z-ai/glm-5.2:free` returning 429 on every call and
# `Qwen/Qwen3.8-Flash` on one of two, so this is not hypothetical: free routes
# carry their own rate limits and queueing, and they are worst placed to
# survive max reasoning effort with no output ceiling.
#
# Only a route failure triggers the fallback - a 4xx/5xx, a timeout, or a
# connection error. A refusal, a short answer or a runaway is the model's own
# output, would be identical on the paid tier, and is left alone.
#
# `route` in each run record names the slug that answered. Check it before
# reading any of these rows: a model served partly by each tier has its
# chapters split across two providers, which this project has already found
# it cannot read as one result (the retired hy3 drift probe).
- id: solar-pro4
  runner: api
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
