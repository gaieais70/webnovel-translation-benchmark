# Gemini as a translation SUBJECT, through Antigravity - the only route this
# project reaches Gemini by. Two things follow from that and are disclosed in
# the report rather than corrected:
#   - The judge (gemini-3.7-flash-high) is the same model family. Self-
#     preference is possible; it is not the same model, but it is not
#     independent either.
#   - agy is an agent, so this row's prompt carries the no-tools line every
#     agy call carries (ati/runners/agy.py). No other row is told that.
# It shares the operator's Antigravity quota with the judge, and the CallGate
# serializes the two: a translation and a judge call never run at once.
