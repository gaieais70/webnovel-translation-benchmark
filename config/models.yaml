# GPT-6 through the Codex CLI on the operator's ChatGPT subscription, not the
# metered OpenAI API (no key is held, and subscription routes come first).
# Slugs from `codex debug models` on 2026-10-22: gpt-6.1-sol is the flagship
# and Codex's own default, gpt-6-astra the other listed GPT-6 tier, gpt-6-luna
# the small one. Max effort, as every row here; `ultra` exists on two of them
# but not on luna, so max is the one setting all three share.
#
# Codex is an agent, so the row strips what it can, as the Claude rows do:
#   - its base instructions are REPLACED by the translation prompt, delivered
#     as a file ({system_prompt_file}; see ati/runners/cli.py);
#   - --ignore-user-config drops the operator's config.toml (its notify hook,
#     full-access sandbox and default model); the sandbox is read-only;
#   - the skills list is switched off. The operator has a skill named
#     novel-translation-engine, which Codex lists to the model by default; a
#     translator that can load a translation playbook is not under the same
#     conditions as the others;
#   - environment context, permissions, AGENTS.md, plugins and the shell,
#     browser and image tools are off. (Codex silently ignores a config key
#     it does not know; each switch here was checked to remove its block,
#     with `codex debug prompt-input` and `codex exec --json`, 2026-10-22.)
#
# Every CLI row in this column asks for structured output (claude-json,
# codex-jsonl) so its record carries token counts, and declares an OpenRouter
# list price: cost is read alongside quality, and run 2026-09's CLI rows have
# no tokens to price.
# What remains, checked with `codex debug prompt-input`: two short developer
# notes on collaboration and multi-agent mode that Codex always sends. These
# rows are therefore a different route from every API row, and not directly
# comparable to them, as with the Claude column.

- id: gpt-6.1-sol
  runner: cli
  output_format: codex-jsonl
  price: {input: 2, output: 10, cached_input: 0.1}   # openai/gpt-6.1-sol, OpenRouter list 2026-10-22
  sandbox: true
  timeout_s: 3600
  command:
    - codex
    - exec
    - --json
    - --ignore-user-config
    - --ephemeral
